tasks:
  - task_id: daily-important-digest
    kind: digest
    digest_type: important_daily
    enabled: false
    cron: "30 7 * * *"
    description: WorldNet 重要事项日报
    source_config:
      window:
        mode: since_last_run
        first_run_fallback: previous_day
      selection:
        max_candidates: 50
        max_items: 10
        priorities: ["p1", "p2", "p3"]
        include_watchlist_only: false
      llm:
        enabled: true
        max_retries: 1
        user_prompt: |
          优先选择对持仓、监管、财报、重大风险有直接影响的信息。
      rendering:
        title: "WorldNet 重要事项日报"
        include_empty_digest: false
      market_sections:
        index_futures_basis:
          enabled: true
          products: ["IF", "IH", "IC", "IM"]
          history_days: 252
          pe_history_days: 252
          lookback_calendar_days: 15
      paper_strategy:
        enabled: true
        initial_nav: 1000000
        minimum_days_to_expiry: 10
        transaction_cost_bps: 5
        switch_threshold_annualized: 0.02
      market_commentary:
        enabled: true
        llm:
          enabled: true
          max_retries: 1
